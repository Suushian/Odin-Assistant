name: Publish Debug APK (test build)

# ── چرا این ورک‌فلو ────────────────────────────────────────────────────
# `build-android-debug.yml` فقط artifact می‌سازد و طبق سیاست پروژه هیچ
# Release ای ایجاد نمی‌کند؛ دانلودِ artifact هم نیازمند ورود به GitHub است.
# این ورک‌فلو برای «تست روی دستگاه» ساخته شده: همان APK دیباگ را می‌سازد و
# به‌صورت یک **pre-release** (نه Latest) با لینک دانلودِ مستقیم منتشر می‌کند.
#
# قیدها:
#   • فقط pre-release؛ هرگز Latest را جابه‌جا نمی‌کند.
#   • keystore تولید (release) خوانده نمی‌شود؛ امضا همان debug keystore گریدل است.
#   • push روی arena/* → pre-release (هرگز Latest را جابه‌جا نمی‌کند).
#   • push روی تگ v* → **انتشار عمومی** (Latest) با همان APK دیباگ‌امضا.
#     چرا اینجا و نه در build-android؟ آن ورک‌فلو فقط با keystore رسمی منتشر
#     می‌کند و در نبود Secrets هیچ APK ای منتشر نمی‌شود؛ این ورک‌فلو برای
#     نسخه‌ای است که با debug keystore امضا شده و صادقانه هم همان را می‌گوید.
on:
  push:
    branches: ["arena/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write      # برای ساخت Release و آپلود asset

concurrency:
  group: debug-apk-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Guard rails (parity + layout)
        run: |
          set -euo pipefail
          node tests/js/smoke_theme_parity.js
          node tests/js/smoke_layout.js

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd android
          gradle assembleDebug --no-daemon --console=plain

      - name: Package APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          VERSION=$(python3 -c "import re,pathlib;print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', pathlib.Path('src/app_paths.py').read_text(encoding='utf-8')).group(1))")
          NAME="ODIN-Assistant-v${VERSION}-debug.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" | tee SHA256.txt
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # ── تگ v* → انتشار عمومی (Latest) ───────────────────────────────
      - name: Publish public release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TITLE="ODIN Assistant ${TAG} — نسخهٔ عمومی اندروید"
          python3 installer/release_notes.py "$TAG" --out /tmp/notes.md
          cat >> /tmp/notes.md <<MD

          ---

          ### 📥 نصب
          1. فایل \`${NAME}\` را از همین صفحه بگیرید.
          2. اگر بیلد دیباگ ۱٫۴–۱٫۶ نصب کرده بودید، اول حذفش کنید (شمارهٔ نسخهٔ
             داخلی‌شان بالاتر بود و اندروید اجازهٔ نصب نسخهٔ پایین‌تر نمی‌دهد).
          3. نصب از منابع ناشناس را برای فایل‌منیجر اجازه دهید.
          4. کلید Twelve Data را در «تنظیمات» وارد کنید.

          ### 🔐 امضا
          این APK با **debug keystore** امضا شده است (نسخهٔ توزیع رسمی/استور
          نیست). برای انتشار در استور، keystore رسمی لازم است.

          - \`versionName\`: \`${VERSION}\`
          - \`versionCode\`: از \`src/app_paths.py\` (major×10000+minor×100+patch)
          - کامیت: \`${{ github.sha }}\`
          - SHA256: در فایل \`SHA256.txt\` همین Release
          MD
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file /tmp/notes.md --latest
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file /tmp/notes.md --verify-tag --latest
          fi
          gh release upload "$TAG" "$NAME" SHA256.txt --repo "$GITHUB_REPOSITORY" --clobber
          echo "✓ https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: Package and publish pre-release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="debug-v${VERSION}-build${{ github.run_number }}"
          gh release create "$TAG" "$NAME" SHA256.txt \
            --title "ODIN Assistant v${VERSION} — Debug APK (build ${{ github.run_number }})" \
            --prerelease \
            --target "${{ github.sha }}" \
            --notes "نسخهٔ **دیباگ** برای تست روی دستگاه — نسخهٔ انتشار نیست.

          - \`versionName\`: \`${VERSION}\` · \`versionCode\` از \`src/app_paths.py\`
          - امضا: debug keystore گریدل (فقط برای تست؛ با نسخهٔ رسمی قابل ارتقا نیست)
          - ساخته‌شده از کامیت \`${{ github.sha }}\`

          **نصب:** فایل APK را روی گوشی باز کنید و «نصب از منابع نامشخص» را برای فایل‌منیجر اجازه دهید.
          کلید Twelve Data را باید خودتان در «تنظیمات» وارد کنید."
