name: Historical market data (manual)

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date (YYYY-MM-DD, UTC)"
        required: true
        default: "2026-04-13"
        type: string
      to_date:
        description: "End date (YYYY-MM-DD, UTC)"
        required: true
        default: "2026-10-13"
        type: string

permissions:
  contents: read

concurrency:
  group: historical-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate date inputs
        env:
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          start = dt.date.fromisoformat(os.environ["FROM_DATE"])
          end = dt.date.fromisoformat(os.environ["TO_DATE"])
          if start >= end:
              raise SystemExit("from_date must be earlier than to_date")
          print(f"Requested UTC date range: {start} -> {end}")
          PY

      - name: Download historical candles
        env:
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
        run: |
          python scripts/backtest/download_data.py \
            --from-date "$FROM_DATE" \
            --to-date "$TO_DATE"

      - name: Validate downloaded CSV data
        if: always()
        run: |
          if find data/historical/dukascopy -type f -name '*.csv' -print -quit 2>/dev/null | grep -q .; then
            python scripts/backtest/validate_data.py \
              --input data/historical/dukascopy \
              --report data/historical/validation-report.json
          else
            mkdir -p data/historical
            printf '{"status":"NO_CSV_FILES","message":"Downloader produced no CSV files; inspect download step logs."}\n' \
              > data/historical/validation-report.json
            echo "::error::No CSV files were downloaded."
            exit 1
          fi

      - name: Upload downloaded data and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-market-data-${{ github.run_number }}
          path: data/historical/
          if-no-files-found: error
          retention-days: 7
