name: Build Android Debug APK

# Development-only APK for device testing. This workflow never creates a Release
# and never reads or uses the production signing keystore/secrets.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "src/app_paths.py"
      - "tests/js/**"
      - ".github/workflows/build-android-debug.yml"

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run JavaScript smoke tests
        run: |
          set -euo pipefail
          for test in \
            tests/js/smoke_about.js \
            tests/js/smoke_icons.js \
            tests/js/smoke_license.js \
            tests/js/smoke_journal.js \
            tests/js/smoke_alerts.js \
            tests/js/smoke_chart.js \
            tests/js/smoke_share.js \
            tests/js/smoke_theme_parity.js \
            tests/js/smoke_layout.js \
            tests/js/smoke_onboarding.js \
            tests/js/smoke_core.js \
            tests/js/smoke_plugins.js \
            tests/js/test_external_url.js \
            tests/js/test_news_render_xss.js \
            tests/js/test_source_freshness.js \
            tests/js/test_market_data_quality.js \
            tests/js/test_news_dedupe_order.js \
            tests/js/test_cycle_switch.js \
            tests/js/test_judge_switch.js
          do
            node "$test"
          done

      - name: Validate app version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("src/app_paths.py").read_text(encoding="utf-8")
          match = re.search(r'APP_VERSION\s*=\s*"([^"]+)"', text)
          if not match:
              print("::error::APP_VERSION missing or unparseable")
              sys.exit(1)
          version = match.group(1)
          parts = version.split("-")[0].split("+")[0].split(".")
          parts += ["0"] * (3 - len(parts))
          if len(parts) < 3 or not all(part.isdigit() for part in parts[:3]):
              print(f"::error::Invalid APP_VERSION: {version}")
              sys.exit(1)
          print(f"Debug APK versionName={version}")
          PY

      - name: Build unsigned debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --console=plain

      - name: Verify APK exists and report metadata
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ODIN-Assistant-android-debug-v1.0.0-run-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
