# ══════════════════════════════════════════════════════════════
#  پیکربندی ODIN Assistant — دستیار تحلیل و سیگنال فارکس  (بدون متاتریدر)
#  این فایل را می‌توانید با هر ویرایشگر متنی (مثل Notepad) تغییر دهید
# ══════════════════════════════════════════════════════════════

# تنها منبع قیمت و کندل بازار: Twelve Data (کلید API لازم است)
data_source: twelvedata

# ── نمادهای تحت پوشش ──────────────────────────────────────────
# td: نماد Twelve Data | tv: تأییدیهٔ تکنیکال جداگانه
symbols:
  - name: EURUSD
    fa: "یورو به دلار آمریکا"
    td: "EUR/USD"
    tv: {screener: forex, exchange: FX, symbol: EURUSD}
    base: EUR
    quote: USD
    pip: 0.0001

  - name: GBPUSD
    fa: "پوند به دلار آمریکا"
    td: "GBP/USD"
    tv: {screener: forex, exchange: FX, symbol: GBPUSD}
    base: GBP
    quote: USD
    pip: 0.0001

  - name: USDJPY
    fa: "دلار آمریکا به ین ژاپن"
    td: "USD/JPY"
    tv: {screener: forex, exchange: FX, symbol: USDJPY}
    base: USD
    quote: JPY
    pip: 0.01

  - name: USDCAD
    fa: "دلار آمریکا به دلار کانادا"
    td: "USD/CAD"
    tv: {screener: forex, exchange: FX, symbol: USDCAD}
    base: USD
    quote: CAD
    pip: 0.0001

  - name: AUDUSD
    fa: "دلار استرالیا به دلار آمریکا"
    td: "AUD/USD"
    tv: {screener: forex, exchange: FX, symbol: AUDUSD}
    base: AUD
    quote: USD
    pip: 0.0001

  - name: USDCHF
    fa: "دلار آمریکا به فرانک سوئیس"
    td: "USD/CHF"
    tv: {screener: forex, exchange: FX, symbol: USDCHF}
    base: USD
    quote: CHF
    pip: 0.0001

  - name: NZDUSD
    fa: "دلار نیوزیلند به دلار آمریکا"
    td: "NZD/USD"
    tv: {screener: forex, exchange: FX, symbol: NZDUSD}
    base: NZD
    quote: USD
    pip: 0.0001

  - name: XAUUSD
    fa: "طلا به دلار آمریکا (انس)"
    td: "XAU/USD"        # با کلید Twelve Data: اسپات واقعی
    tv: {screener: cfd, exchange: OANDA, symbol: XAUUSD}
    base: XAU
    quote: USD
    pip: 1.0             # برای طلا هر واحد = ۱ دلار (در گزارش با $ نمایش داده می‌شود)

# ── تنظیمات موتور تکنیکال ─────────────────────────────────────
analysis:
  ema_fast: 50            # میانگین متحرک سریع (تشخیص روند)
  ema_slow: 200           # میانگین متحرک کند
  adx_period: 14
  adx_min_trend: 20       # زیر این مقدار = بازار بی‌روند (وتو)
  adx_strong: 25
  rsi_period: 14
  atr_period: 14
  swing_window: 5         # پنجره تشخیص قله/کف (سطوح حمایت و مقاومت)
  strength_lookback_h1: 24   # بازه محاسبه قدرت ارزها (کندل یک‌ساعته ≈ ۲۴ ساعت)

# ── تاریخچه مورد نیاز ─────────────────────────────────────────
history:
  td_m15_bars: 5000        # یک درخواست برای هر نماد؛ H1/H4 از M15 ساخته می‌شوند
  drop_forming_candle: true   # کندل در حال تشکیل نادیده گرفته شود (تحلیل فقط روی کندل بسته)

# ── تاییدیه تریدینگ‌ویو ────────────────────────────────────────
# API غیررسمی (بدون لاگین) — اگر از دسترس خارج شد، برنامه بدون آن به کارش ادامه می‌دهد
tradingview:
  enabled: true
  timeframe: 4h           # تایم‌فریم تاییدیه: 15m | 1h | 4h | 1D

# ── Twelve Data: تنها منبع قیمت و کندل بازار ──────────────────
# کلید API اختصاصی را در تنظیمات محلی وارد کنید؛ آن را در مخزن ثبت نکنید
twelvedata:
  api_key: ""
  min_request_gap_sec: 8  # محدودیت tier رایگان: ۸ درخواست در دقیقه

# ══════════════════════════════════════════════════════════════
#  مرحله ۲ — موتور فاندامنتال و اخبار
# ══════════════════════════════════════════════════════════════

# ── تقویم اقتصادی ──────────────────────────────────────────────
# منبع: فید JSON هفتگی ForexFactory (رایگان، بدون کلید، بدون ثبت‌نام)
# ⚠️ این فید فقط «هفتهٔ جاری» (شنبه تا جمعه) را پوشش می‌دهد
fundamental:
  enabled: true
  source_url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
  cache_ttl_minutes: 30      # چند دقیقه دادهٔ کش‌شده معتبر است (کمتر = درخواست بیشتر)
  horizon_hours: 48          # در گزارش، رویدادهای چند ساعت آینده نمایش داده شود
  veto_minutes_before: 30    # 🔴 وتو: رویداد پراثر تا این دقیقه آینده → سیگنال آن نماد ممنوع
  alerts_enabled: true       # هشدار تلگرامی قبل از رویداد پراثر
  alert_before_minutes: 30   # چند دقیقه قبل از رویداد هشدار بدهد
  alert_grace_minutes: 10    # اگر برنامه تازه روشن شد، تا این دقیقه بعد از رویداد هم هشدار بده

# ── موتور اخبار (RSS) ──────────────────────────────────────────
# اگر feeds را خالی/حذف کنید، فیدهای پیش‌فرض استفاده می‌شوند:
#   ForexLive · Investing.com (فارکس/اقتصاد/طلا) · FXStreet از مسیر Google News
# ⚠️ فید مستقیم FXStreet و DailyFX دسترسی رباتیک را می‌بندد (۴۰۳)؛ برای همین
#    FXStreet از مسیر Google News RSS خوانده می‌شود که پایدارتر است.
news:
  enabled: true
  max_age_hours: 30          # خبر قدیمی‌تر از این = بی‌فایده (و فید کهنه تشخیص داده می‌شود)
  min_score: 2               # حداقل امتیاز اهمیت برای ورود به گزارش (۰ تا ۶)
  max_items_per_feed: 12
  max_total: 18              # حداکثر چند خبر در گزارش
  # feeds:                   # ← برای سفارشی‌سازی، این بخش را باز کنید
  #   - {name: ForexLive, url: "https://www.forexlive.com/feed", weight: 2}

# ── بریفینگ صبحگاهی 🌅 ─────────────────────────────────────────
# گزارش مستقل و خلاصه، قبل از باز شدن بازار لندن (۰۷:۰۰–۰۸:۰۰ UTC)
briefing:
  enabled: true
  times_utc: ["06:30"]       # می‌توانید چند ساعت بگذارید: ["06:30", "12:00"]
  horizon_hours: 24          # رویدادهای ۲۴ ساعت آینده
  catchup_window_minutes: 90 # اگر برنامه دیر روشن شد، تا این قدر دیرتر بریفینگ را بفرست

# ══════════════════════════════════════════════════════════════
#  مرحله ۳ — ⚖️ داور امتیازدهی (Confluence) و تولید سیگنال
# ══════════════════════════════════════════════════════════════
# دو لایه: ابتدا وتوهای ایمنی مستقل و شمارش وتوهای معاملاتی، سپس جدول امتیاز.
# وتوهای عادی فقط از آستانهٔ min_count به بالا مانع‌اند؛ آستانهٔ امتیاز نیز مستقل است.
judge:
  enabled: true
  min_score: 5               # آستانهٔ صدور سیگنال (حداکثر ممکن = ۱۱)
  max_signals_per_cycle: 3   # سقف تعداد سیگنال در هر چرخه (جلوگیری از نویز)

  # ── کنترل اسپم: حلقه هر ۱۵ دقیقه است، یک ستاپ چندساعته نباید ده‌ها بار برود
  resend_cooldown_minutes: 180   # سیگنال تکراری قبل از این مدت دوباره ارسال نمی‌شود
  resend_score_gain: 2           # مگر اینکه امتیاز حداقل این‌قدر بهتر شده باشد

  # ── وتوهای تجمعی: یک عامل به‌تنهایی کافی نیست؛ حداقل min_count عامل لازم است.
  # دادهٔ ناکافی و غیرقابل‌اعتماد بودن تقویم همچنان وتوی ایمنیِ مستقل هستند.
  veto:
    min_count: 2             # حداقل دو وتوی معاملاتی هم‌زمان برای توقف سیگنال
    weekend: true            # 🔒 بازار بسته (شنبه/یکشنبه و جمعه بعد از ۲۱ UTC)
    high_impact_event: true  # 📅 رویداد پراثر تقویم نزدیک (پنجرهٔش در fundamental.veto_minutes_before)
    timeframe_conflict: true # 🔀 تضاد جهت بین ۴ ساعته و ۱ ساعته
    range_market: true       # 😴 بازار بی‌روند (ADX زیر analysis.adx_min_trend)
    volatility_spike: true   # 📈 جهش غیرعادی نوسان (جایگزین صادقانهٔ «اسپرد غیرعادی»)
    breaking_news: true      # 🚨 خبر فوریِ مرتبط با این نماد

  # ── جهش نوسان: چون بدون بروکر «اسپرد» نداریم، از ATR استفاده می‌شود
  volatility:
    spike_multiplier: 2.0    # اگر ATR فعلی > این‌قدر برابر میانگین باشد → وتو
    lookback_bars: 100       # میانگین روی چند کندل یک‌ساعتهٔ اخیر

  # ── مدرک «پنجرهٔ فاندامنتال پاک» (+۲ امتیاز)
  fundamental:
    clean_high_hours: 6      # نبود رویداد پراثر تا این‌قدر ساعت آینده → ۲ امتیاز
    clean_med_hours: 2       # نبود رویداد متوسط تا این‌قدر ساعت آینده → امتیاز کامل

  # ── مدرک «واکنش به سطح کلیدی» (+۲ امتیاز) — فاصله بر حسب ATR
  level:
    close_atr: 0.5           # چسبیده به سطح → ۲ امتیاز
    near_atr: 1.5            # نزدیک سطح → ۱ امتیاز

  # ── مدرک خبری
  news:
    min_score: 4             # حداقل امتیاز خبر برای اینکه شمرده شود
    breaking_min_score: 5    # حداقل امتیاز خبر فوری برای وتو کردن سیگنال

  # ── مدیریت ریسک سیگنال (ورود / حد ضرر / هدف)
  risk:
    sl_atr_multiplier: 1.5   # حد ضرر بر پایهٔ ATR وقتی سطح کلیدی در دسترس نیست
    level_buffer_atr: 0.3    # حد ضرر کمی آن‌سوی حمایت/مقاومت قرار می‌گیرد
    max_sl_atr: 3.0          # سقف فاصلهٔ حد ضرر (ریسک بزرگ نشود)
    min_sl_atr: 0.6          # کف فاصلهٔ حد ضرر (با نویز خورد نشود)
    reward_risk: 2.0         # نسبت سود به ریسکِ عمومی (۱:۲)
    max_risk_percent: 1.0    # فقط برای نمایش در پیام سیگنال

# ══════════════════════════════════════════════════════════════
#  مرحله ۴ — 📔 ژورنال سیگنال و آمار دقت (حلقهٔ صداقت)
# ══════════════════════════════════════════════════════════════
# هر سیگنال در logs/signals.jsonl ثبت می‌شود (append-only، مقاوم به کرش).
# نتیجهٔ هر سیگنال به‌صورت خودکار از روی کندل‌های M15 تعیین می‌شود.
journal:
  enabled: true
  expiry_hours: 48           # اگر تا این مدت نه هدف خورد نه حد ضرر → منقضی
  # اگر یک کندل هر دو سطح (TP و SL) را بزند، ترتیب برخورد قابل دانستن نیست؛
  # با true محتاطانه «ضرر» شمرده می‌شود تا آمار دقت باد نکند.
  conservative_both_touch: true

  # 🌙 خلاصهٔ شبانه — بعد از بسته‌شدن سشن نیویورک
  nightly:
    enabled: true
    time_utc: "21:30"
    catchup_window_minutes: 60   # اگر برنامه دیر روشن شد، تا این قدر دیرتر بفرست

  # 📊 گزارش هفتگی دقت — day_utc: 0=دوشنبه … 6=یکشنبه
  weekly:
    enabled: true
    day_utc: 6
    time_utc: "20:00"
    catchup_window_minutes: 120

# ══════════════════════════════════════════════════════════════
#  رابط کاربری (UI)
# ══════════════════════════════════════════════════════════════
ui:
  user_name: "سوشیان"     # نامی که در Splash و هدر نمایش داده می‌شود («خوش اومدی …»)
  splash: true            # صفحهٔ خوش‌آمدگویی هنگام شروع
  animations: true        # انیمیشن‌های ظریف (اگر false، همه‌چیز آنی است)

# ── تلگرام ─────────────────────────────────────────────────────
# ⚠️ توکن و شناسه چت را مستقیم اینجا ننویسید! پنل گرافیکی آن‌ها را در فایل
#    امن config.local.yaml ذخیره می‌کند که هرگز به گیت‌هاب push نمی‌شود.
telegram:
  send_reports: true
  bot_token: ""     # از طریق پنل پر می‌شود (@BotFather)
  chat_id: ""       # از طریق پنل پر می‌شود (دکمه «گرفتن خودکار»)

# ── فراخوانی‌های سیستم پلاگین (معماری پلاگین — فاز ۷) ────────────
# بخشِ *اختیاری* برای فعال/غیرفعال‌کردن تک‌تک پلاگین‌ها. پیش‌فرض خالی است و
# تا وقتی خالی است، فعال/غیرفعال دقیقاً با همان کلیدهای فیچریِ بالا کار
# می‌کند (news.enabled، judge.veto.*، fundamental.enabled و ...).
# ترتیب اولویت (بالا = برنده):
#   ۱) plugins.<id>.enabled     ← override صریح (اینجا)
#   ۲) کلید فیچریِ موجود        ← مثل news.enabled (همان معنای امروز)
#   ۳) پیش‌فرض مانیفست پلاگین
#   ۴) true
# شناسهٔ پلاگین‌های بازار: data-twelvedata؛ TradingView فقط تأییدیهٔ تکنیکال است
#   · analysis-technical · analysis-strength · session · fundamental-calendar
#   · fundamental-news · judge-core · judge-risk · veto-data · veto-weekend
#   · veto-tf-conflict · veto-range · veto-event · veto-vol-spike
#   · veto-breaking-news · ev-trend · ev-level · ev-fundamental · ev-momentum
#   · ev-strength · ev-news · ev-tv · ev-session · journal · notify-telegram
#   · alerts-price · report-renderer
# مثال (فقط شکل را نشان می‌دهد — به‌صورت پیش‌فرض فعال نکنید):
#   plugins:
#     veto-weekend: { enabled: false }        # فقط وتوی آخر هفته حذف شود
#     fundamental-news: { enabled: false }    # پلاگین اخبار فارغ از news.enabled
# نکتهٔ معنایی: override فقط «دسترس‌پذیری پلاگین» را کنترل می‌کند؛ رفتارِ
# مصرف‌کننده‌ها همچنان با کلیدهای فیچری است (برای خاموش‌کردن کامل یک فیچر،
# همان کلید فیچری را خاموش کنید). plugins.<id>.config هم به‌صورت عمیق روی
# بخش config پلاگین ادغام می‌شود (فعلاً مصرف‌کننده‌ای ندارد).
plugins: {}

# ── حلقه اجرای خودکار (دکمه «شروع ربات» در پنل) ────────────────
loop:
  interval_minutes: 15   # فاصله بین تحلیل‌های خودکار
