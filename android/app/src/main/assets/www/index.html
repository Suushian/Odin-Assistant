<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E7E7EC">
<!-- باز نگه‌داشتن هر ارتباط خروجی از صفحه: اپ فقط فایل‌های محلی خودش را
     می‌خواند (file://) و هیچ اسکریپت/فریم/بیرونی لازم ندارد. این CSP یک
     لایهٔ دفاعی است، نه جایگزینِ اسکریپت‌های اعلامی.
     style-src عمداً 'unsafe-inline' دارد: ۱۲۷ style attribute در رشته‌های
     innerHTML استفاده می‌شود؛ حذف آن چیدمان را می‌شکند. script-src همچنان
     بدون unsafe-inline/unsafe-eval است. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
<title>ODIN ASSISTANT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- پس‌زمینهٔ گرادیان محو (مثل paintEvent دسکتاپ) -->
<div id="bg" aria-hidden="true"></div>

<!-- Splash: کارت مشکی «خوش اومدی سوشیان» -->
<div id="splash" class="hidden">
  <div class="splash-card">
    <div class="splash-logo">
      <svg viewBox="0 0 48 48" width="52" height="52" aria-hidden="true">
        <g transform="scale(0.4444)"><path d="M39.0 16.0H69.0A23 23 0 0 1 92.0 39.0V69.0A23 23 0 0 1 69.0 92.0H39.0A23 23 0 0 1 16.0 69.0V39.0A23 23 0 0 1 39.0 16.0Z M39.0 65.5 L40.0 65.4 L41.0 65.1 L41.9 64.7 L42.7 64.1 L43.4 63.3 L43.9 62.5 L44.3 61.5 L44.6 60.3 L48.7 76.3 L49.0 77.4 L49.6 78.3 L50.4 79.1 L51.3 79.8 L52.3 80.2 L53.4 80.5 L54.5 80.5 L55.6 80.3 L56.6 79.8 L57.5 79.2 L58.3 78.4 L58.9 77.5 L59.3 76.5 L63.0 63.1 L63.1 63.3 L63.8 64.1 L64.6 64.7 L65.5 65.1 L66.5 65.4 L67.5 65.5 L84.0 65.5 L85.1 65.4 L86.1 65.1 L87.1 64.6 L87.9 63.9 L88.6 63.1 L89.1 62.1 L89.4 61.1 L89.5 60.0 L89.4 58.9 L89.1 57.9 L88.6 56.9 L87.9 56.1 L87.1 55.4 L86.1 54.9 L85.1 54.6 L84.0 54.5 L70.9 54.5 L66.4 45.5 L65.8 44.6 L65.1 43.8 L64.2 43.2 L63.2 42.8 L62.1 42.5 L61.0 42.5 L59.9 42.7 L58.9 43.2 L58.0 43.8 L57.2 44.6 L56.6 45.5 L56.2 46.5 L54.3 53.4 L50.3 37.7 L50.0 36.6 L49.4 35.7 L48.6 34.9 L47.7 34.2 L46.7 33.8 L45.6 33.5 L44.5 33.5 L43.5 33.7 L42.4 34.1 L41.5 34.8 L40.7 35.5 L40.1 36.5 L39.7 37.5 L34.9 54.5 L24.0 54.5 L22.9 54.6 L21.9 54.9 L20.9 55.4 L20.1 56.1 L19.4 56.9 L18.9 57.9 L18.6 58.9 L18.5 60.0 L18.6 61.1 L18.9 62.1 L19.4 63.1 L20.1 63.9 L20.9 64.6 L21.9 65.1 L22.9 65.4 L24.0 65.5 L39.0 65.5 Z" fill="#F4F8FD" fill-rule="evenodd"/></g>
      </svg>
    </div>
    <div class="splash-brand" dir="ltr">ODIN ASSISTANT</div>
    <div class="splash-name" id="splash-name">خوش اومدی!</div>
    <div class="splash-sub">دستیار تحلیل فارکس و طلا — بدون معاملهٔ خودکار</div>
    <!-- عدد نسخه عمداً در placeholder نیست: app.js آن را از PackageManager پر
     می‌کند. پیش‌تر «v0.19.0» هاردکد بود و اگر JS خطا می‌کرد کاربر نسخهٔ
     اشتباه می‌دید. -->
<div class="splash-ver" id="splash-ver">… · android</div>
  </div>
</div>

<div id="app" class="hidden">
  <!-- هدر -->
  <header id="hdr">
    <div class="hdr-main">
      <div>
        <div id="greet">سلام!</div>
        <!-- نام برند عمداً اینجا نیست: در Splash و «دربارهٔ ما» هست و تکرارش
       در هدر، باعث سرریز ۳۲px و دوخطی‌شدن ساعت می‌شد (v0.22.0 رفع شد). -->
        <div id="appsub">تحلیل و سیگنال · غیرخودکار</div>
      </div>
      <div class="hdr-side">
        <div id="clock" class="clock-pill">—</div>
        <button class="circle-btn" id="btn-settings" aria-label="تنظیمات">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="3.2"/>
            <path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="hdr-status"></div>
  </header>

  <!-- صفحه‌ها -->
  <main id="pages">
    <section class="page" id="page-home"></section>
    <section class="page hidden" id="page-signals"></section>
    <section class="page hidden" id="page-calendar"></section>
    <section class="page hidden" id="page-news"></section>
    <section class="page hidden" id="page-journal"></section>
    <section class="page hidden" id="page-settings"></section>
    <section class="page hidden" id="page-briefing"></section>
    <section class="page hidden" id="page-about"></section>
    <section class="page hidden" id="page-chart"></section>
  </main>

  <!-- نوار تب پایین — کارت شناور سفید، تب فعال پیِل مشکی -->
  <nav id="tabbar">
    <button class="tab" data-tab="home">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.8l8.5 6.7V20a1 1 0 0 1-1 1h-4.6v-5.6H9.1V21H4.5a1 1 0 0 1-1-1z"/></svg>
      <span>خانه</span>
    </button>
    <button class="tab" data-tab="signals">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 3 5 6.5l1.7 3.4M12 3l7 3.5-1.7 3.4M5 6.5 3 17.5c0 2 4 3.5 9 3.5s9-1.5 9-3.5L19 6.5M12 7v14"/></svg>
      <span>سیگنال‌ها</span>
      <i class="badge hidden" id="badge-signals"></i>
    </button>
    <button class="tab" data-tab="calendar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.6"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>تقویم</span>
    </button>
    <button class="tab" data-tab="news">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13a1 1 0 0 1 1 1v13a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z"/><path d="M7.5 9h6M7.5 12.5h6M7.5 16h3.5"/></svg>
      <span>اخبار</span>
      <i class="badge hidden" id="badge-news"></i>
    </button>
    <button class="tab" data-tab="journal">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 1 6.5 18H19v3H6.5A1.5 1.5 0 0 1 5 19.5zM9 7.5h6"/></svg>
      <span>ژورنال</span>
    </button>
  </nav>
</div>

<!-- پیشرفت تحلیل -->
<div id="progress-root" class="hidden">
  <div class="progress-card">
    <div class="progress-head">
      <div class="spinner"></div>
      <div id="progress-title">در حال تحلیل...</div>
    </div>
    <div id="progress-log"></div>
    <button id="progress-close" class="btn hidden">بستن</button>
  </div>
</div>

<!-- مودال -->
<div id="modal-root" class="hidden">
  <div class="modal-card">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<!-- تست -->
<div id="toast-root" class="hidden"></div>

<!-- هستهٔ معماری پلاگین (فاز ۵) + پلاگین‌های داخلی اندروید (فاز ۶) — باید
     *پیش از همه* بار شوند: app.js/data.js قابلیت‌ها را از O.makeCaps مصرف
     می‌کنند و ساخت registry به بودنِ O.core در زمان اجرا نیاز دارد. -->
<script src="js/core.js"></script>
<script src="js/plugins.js"></script>
<script src="js/md5.js"></script>
<script src="js/fa.js"></script>
<script src="js/icons.js"></script>
<script src="js/nacl.js"></script>
<script src="js/license.js"></script>
<script src="js/config.js"></script>
<script src="js/indicators.js"></script>
<script src="js/session.js"></script>
<script src="js/technical.js"></script>
<script src="js/calendar.js"></script>
<script src="js/news.js"></script>
<script src="js/judge.js"></script>
<script src="js/journal.js"></script>
<script src="js/data.js"></script>
<script src="js/alerts.js"></script>
<script src="js/chart.js"></script>
<script src="js/sharecard.js"></script>
<script src="js/briefing.js"></script>
<!-- اجزای Aurora Glass 2.0 (پورت widgets.py دسکتاپ) — باید پیش از ui.js بار شود -->
<script src="js/components.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
